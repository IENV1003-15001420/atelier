<aside
  [ngClass]="abierta ? 'w-64' : 'w-20'"
  class="h-full bg-[#fcfbfa] border-r border-gray-200 py-6 flex flex-col transition-all duration-300 whitespace-nowrap overflow-y-auto shrink-0">

  <div class="px-6 pb-8 flex items-center gap-3" [ngClass]="abierta ? 'justify-start' : 'justify-center'">
    <img src="/logo_atelier.png" alt="Logo Atelier" class="w-8 h-8 object-contain">
    <div *ngIf="abierta">
      <h2 class="text-[#6b1d24] font-serif text-2xl m-0 leading-none">Atelier</h2>
      <span class="text-[10px] text-gray-500 tracking-widest">CARPINTERÍA DIGITAL</span>
    </div>
  </div>

  <div *ngFor="let seccion of seccionesVisibles" class="mb-6">
    <span *ngIf="abierta" class="text-[10px] text-gray-400 px-6 mb-2 block tracking-widest">
      {{ seccion.encabezado }}
    </span>

    <a *ngFor="let item of seccion.items"
       [routerLink]="item.ruta"
       routerLinkActive="bg-[#6b1d24] text-white rounded-r-full mr-5"
       [routerLinkActiveOptions]="{ exact: true }"
       class="flex items-center gap-4 px-6 py-2.5 text-sm text-gray-600 hover:bg-gray-100 transition-colors"
       [title]="item.titulo">
      <span class="text-lg">{{ item.icono }}</span>
      <span *ngIf="abierta">{{ item.titulo }}</span>
    </a>
  </div>
</aside>
